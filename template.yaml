AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Tech Challenge Fase 4 - Plataforma de feedback
Parameters:
  AdminEmail:
    Type: String
    Description: E-mail do administrador que recebe os avisos
  CronRelatorio:
    Type: String
    Default: cron(0 11 ? * MON *)
    Description: Agendamento do relatorio em UTC (padrao - segunda-feira 08:00 em Brasilia)

Globals:
  Function:
    Runtime: java25
    Architectures: [x86_64]
    CodeUri: target/function.zip
    Handler: io.quarkus.amazon.lambda.runtime.QuarkusStreamHandler::handleRequest
    MemorySize: 1024
    Timeout: 25
    Environment:
      Variables:
        JAVA_TOOL_OPTIONS: "-XX:+TieredCompilation -XX:TieredStopAtLevel=1"

Resources:
  AvaliacoesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  FeedbackApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "${AWS::StackName}-api"
      StageName: prod
      Auth:
        ApiKeyRequired: true
        UsagePlan:
          CreateUsagePlan: PER_API
          Description: Plano de uso da API de feedback
          Throttle:
            RateLimit: 10
            BurstLimit: 20

  UrgenciaTopic:
    Type: AWS::SNS::Topic

  AdminTopic:
    Type: AWS::SNS::Topic
    Properties:
      Subscription:
        - Protocol: email
          Endpoint: !Ref AdminEmail

  NotificacaoDLQ:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600

  ReceberFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Valida, classifica a urgencia e grava a avaliacao
      Environment:
        Variables:
          QUARKUS_LAMBDA_HANDLER: receber-avaliacao
          TABELA_AVALIACOES: !Ref AvaliacoesTable
          TOPICO_URGENCIA_ARN: !Ref UrgenciaTopic
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref AvaliacoesTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt UrgenciaTopic.TopicName
      Events:
        PostAvaliacao:
          Type: Api
          Properties:
            RestApiId: !Ref FeedbackApi
            Path: /avaliacao
            Method: post      
  
  NotificarFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Envia o e-mail de aviso de urgencia ao administrador
      Environment:
        Variables:
          QUARKUS_LAMBDA_HANDLER: notificar-urgencia
          TOPICO_ADMIN_ARN: !Ref AdminTopic
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt NotificacaoDLQ.Arn
      Policies:
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt AdminTopic.TopicName
      Events:
        AvaliacaoCritica:
          Type: SNS
          Properties:
            Topic: !Ref UrgenciaTopic
  
  RelatorioFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Gera e envia o relatorio semanal de feedbacks
      Timeout: 60
      Environment:
        Variables:
          QUARKUS_LAMBDA_HANDLER: gerar-relatorio-semanal
          TABELA_AVALIACOES: !Ref AvaliacoesTable
          TOPICO_ADMIN_ARN: !Ref AdminTopic
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref AvaliacoesTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt AdminTopic.TopicName
      Events:
        Semanal:
          Type: Schedule
          Properties:
            Schedule: !Ref CronRelatorio

  AlertasTopic:
    Type: AWS::SNS::Topic
    Properties:
      Subscription:
        - Protocol: email
          Endpoint: !Ref AdminEmail
  
  AlarmeErrosReceber:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Erros na funcao receber-avaliacao
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ReceberFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertasTopic]

  AlarmeErrosNotificar:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Erros na funcao notificar-urgencia
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref NotificarFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertasTopic]

  AlarmeErrosRelatorio:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Erros na funcao gerar-relatorio-semanal
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref RelatorioFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertasTopic]

  AlarmeApi5xx:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Respostas 5xx no API Gateway
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: !Sub "${AWS::StackName}-api"
        - Name: Stage
          Value: prod
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertasTopic]

  AlarmeLatenciaReceber:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Latencia p95 alta na funcao receber-avaliacao (maior que 5s)
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref ReceberFunction
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertasTopic]

  AlarmeDLQ:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Ha avisos de urgencia nao entregues (DLQ nao vazia)
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt NotificacaoDLQ.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertasTopic]

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${AWS::StackName}-dashboard"
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Invocacoes por funcao", "region": "${AWS::Region}", "stat": "Sum", "period": 300,
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "${ReceberFunction}"],
                  ["AWS/Lambda", "Invocations", "FunctionName", "${NotificarFunction}"],
                  ["AWS/Lambda", "Invocations", "FunctionName", "${RelatorioFunction}"]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Erros por funcao", "region": "${AWS::Region}", "stat": "Sum", "period": 300,
                "metrics": [
                  ["AWS/Lambda", "Errors", "FunctionName", "${ReceberFunction}"],
                  ["AWS/Lambda", "Errors", "FunctionName", "${NotificarFunction}"],
                  ["AWS/Lambda", "Errors", "FunctionName", "${RelatorioFunction}"]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Duracao p95 (ms)", "region": "${AWS::Region}", "stat": "p95", "period": 300,
                "metrics": [
                  ["AWS/Lambda", "Duration", "FunctionName", "${ReceberFunction}"],
                  ["AWS/Lambda", "Duration", "FunctionName", "${NotificarFunction}"],
                  ["AWS/Lambda", "Duration", "FunctionName", "${RelatorioFunction}"]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "API Gateway - requisicoes e erros", "region": "${AWS::Region}", "stat": "Sum", "period": 300,
                "metrics": [
                  ["AWS/ApiGateway", "Count", "ApiName", "${AWS::StackName}-api", "Stage", "prod"],
                  ["AWS/ApiGateway", "4XXError", "ApiName", "${AWS::StackName}-api", "Stage", "prod"],
                  ["AWS/ApiGateway", "5XXError", "ApiName", "${AWS::StackName}-api", "Stage", "prod"]
                ]
              }
            }
          ]
        }

Outputs:
  ReceberFunctionName:
    Value: !Ref ReceberFunction
  TabelaAvaliacoes:
    Value: !Ref AvaliacoesTable
  ApiUrl:
    Description: Endpoint de recebimento de avaliacoes
    Value: !Sub "https://${FeedbackApi}.execute-api.${AWS::Region}.amazonaws.com/prod/avaliacao"
  ApiKeyId:
    Description: ID da API Key
    Value: !Ref FeedbackApiApiKey
  UrgenciaTopicArn:
    Value: !Ref UrgenciaTopic
  RelatorioFunctionName:
    Value: !Ref RelatorioFunction